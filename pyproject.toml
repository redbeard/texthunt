[project]
name = "texthunt"
version = "0.1.0"
description = "Probabilistic authorship identification for short, informal text"
readme = "README.md"
authors = [
    { name = "Tal Rotbart", email = "40684+redbeard@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
# Engine B (LUAR). Heavy; install with `uv sync --extra embeddings`.
embeddings = [
    "torch>=2.2",
    "transformers>=4.40",
    "einops>=0.7",  # required by LUAR's remote modeling code
]
# Slack export. Install with `uv sync --extra slack`.
slack = [
    "slack-sdk>=3.27",
]

[project.scripts]
texthunt = "texthunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.42",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: needs network/model downloads; deselected by default"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# Optional-dependency glue (torch/transformers/LUAR); behaviour is covered by stub-based unit tests,
# and the deps are absent in a default `uv sync`, so static analysis here is noise either way.
exclude = ["src/texthunt/embeddings.py"]
